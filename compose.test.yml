# Disposable database, no host port or persistent volumes. Use npm run test:docker.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: clean_api_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d clean_api_test']
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    init: true
    environment:
      NODE_ENV: test
      TEST_DB_HOST: db
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: test-only-password
      TEST_DB_NAME: clean_api_test
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'test:coverage']
