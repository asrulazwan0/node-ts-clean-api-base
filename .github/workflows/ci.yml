name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-database:
    name: Quality and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clean_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d clean_api_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: ci-only-password
      TEST_DB_NAME: clean_api_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run audit
      - name: Compiled native startup, migration, smoke, and graceful shutdown
        env:
          NODE_ENV: production
          PORT: 3301
          SMOKE_BASE_URL: http://127.0.0.1:3301
          DB_HOST: ${{ env.TEST_DB_HOST }}
          DB_PORT: ${{ env.TEST_DB_PORT }}
          DB_USERNAME: ${{ env.TEST_DB_USERNAME }}
          DB_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          DB_NAME: ${{ env.TEST_DB_NAME }}
          LOG_LEVEL: silent
        run: |
          node dist/infrastructure/database/cli.js run
          node dist/index.js > "$RUNNER_TEMP/native-server.log" 2>&1 &
          native_pid=$!
          trap 'kill -TERM "$native_pid" 2>/dev/null || true; wait "$native_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch(process.env.SMOKE_BASE_URL + '/health/ready', {
                signal: AbortSignal.timeout(2000),
              });
              if (response.ok) { ready = true; break; }
            } catch {}
            await setTimeout(250);
          }
          if (!ready) throw new Error('Native readiness timeout');
          JS
          npm run smoke
          kill -TERM "$native_pid"
          wait "$native_pid"
          trap - EXIT

  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:http
      - run: npm run build

  docker-production:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: clean-api-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_PORT: 55432
      PORT: 3300
      SMOKE_BASE_URL: http://127.0.0.1:3300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Download and compare the exact source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/source.tar.gz"
          mkdir "$RUNNER_TEMP/release-source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/release-source"
          git ls-files -z | while IFS= read -r -d '' tracked_file; do
            cmp "$tracked_file" "$RUNNER_TEMP/release-source/$tracked_file"
          done
      - name: Build, migrate, and await readiness on a fresh database
        working-directory: ${{ runner.temp }}/release-source
        run: docker compose --env-file .env.example up --build --wait --wait-timeout 180
      - run: npm run smoke
        working-directory: ${{ runner.temp }}/release-source
      - name: Verify the runtime contains the exact application license
        working-directory: ${{ runner.temp }}/release-source
        run: docker compose --env-file .env.example exec -T app cat /app/LICENSE | cmp - LICENSE
      - name: Show service status and logs
        working-directory: ${{ runner.temp }}/release-source
        if: always()
        run: |
          docker compose --env-file .env.example ps --all
          docker compose --env-file .env.example logs --no-color
      - name: Remove only this job's disposable stack
        working-directory: ${{ runner.temp }}/release-source
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  docker-tests:
    name: Isolated container tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run test:docker

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history locally without network access or report uploads
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts=--all
